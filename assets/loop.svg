<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">The loop</title>
  <desc id="d">Every change goes through five steps: you ask, the agent snapshots the repo, changes Home Assistant through MCP, exports and scrubs the result, then checks and commits it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F59E6B"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="58" fill="#41BDF5" font-size="14" font-weight="700" letter-spacing="2.8">THE LOOP</text>
    <text x="40" y="90" fill="#f1f5f9" font-size="26" font-weight="700">Every change the agent makes goes through the same five steps</text>

    <!-- step cards: x = 40 + i*230, width 200 -->
    <g>
      <rect x="40" y="122" width="200" height="176" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#334155"/>
      <circle cx="72" cy="154" r="16" fill="#a78bfa"/>
      <text x="72" y="160" text-anchor="middle" fill="#0b1220" font-size="16" font-weight="800">1</text>
      <text x="58" y="202" fill="#f1f5f9" font-size="20" font-weight="700">You ask</text>
      <text x="58" y="232" fill="#94a3b8" font-size="15" font-style="italic">“Dim the hallway</text>
      <text x="58" y="254" fill="#94a3b8" font-size="15" font-style="italic">to 20% after 11pm”</text>

      <rect x="270" y="122" width="200" height="176" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#334155"/>
      <circle cx="302" cy="154" r="16" fill="#F59E6B"/>
      <text x="302" y="160" text-anchor="middle" fill="#0b1220" font-size="16" font-weight="800">2</text>
      <text x="288" y="202" fill="#f1f5f9" font-size="20" font-weight="700">Snapshot</text>
      <text x="288" y="232" fill="#94a3b8" font-size="15">Export what's live and</text>
      <text x="288" y="254" fill="#94a3b8" font-size="15">commit any drift first</text>

      <rect x="500" y="122" width="200" height="176" rx="16" fill="#41BDF5" fill-opacity="0.08" stroke="#41BDF5" stroke-opacity="0.6"/>
      <circle cx="532" cy="154" r="16" fill="#41BDF5"/>
      <text x="532" y="160" text-anchor="middle" fill="#0b1220" font-size="16" font-weight="800">3</text>
      <text x="518" y="202" fill="#f1f5f9" font-size="20" font-weight="700">Change live</text>
      <text x="518" y="232" fill="#94a3b8" font-size="15">Through MCP, so Home</text>
      <text x="518" y="254" fill="#94a3b8" font-size="15">Assistant validates it</text>

      <rect x="730" y="122" width="200" height="176" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#334155"/>
      <circle cx="762" cy="154" r="16" fill="#38bdf8"/>
      <text x="762" y="160" text-anchor="middle" fill="#0b1220" font-size="16" font-weight="800">4</text>
      <text x="748" y="202" fill="#f1f5f9" font-size="20" font-weight="700">Export &amp; scrub</text>
      <text x="748" y="232" fill="#94a3b8" font-size="15">Collect, redact secrets,</text>
      <text x="748" y="254" fill="#94a3b8" font-size="15">one file per thing</text>

      <rect x="960" y="122" width="200" height="176" rx="16" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.6"/>
      <circle cx="992" cy="154" r="16" fill="#22c55e"/>
      <text x="992" y="160" text-anchor="middle" fill="#0b1220" font-size="16" font-weight="800">5</text>
      <text x="978" y="202" fill="#f1f5f9" font-size="20" font-weight="700">Check &amp; commit</text>
      <text x="978" y="232" fill="#94a3b8" font-size="15">Secret scan, validate,</text>
      <text x="978" y="254" fill="#94a3b8" font-size="15">changelog, git commit</text>
    </g>

    <!-- arrows between cards -->
    <g stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
      <line x1="244" y1="210" x2="264" y2="210"/>
      <line x1="474" y1="210" x2="494" y2="210"/>
      <line x1="704" y1="210" x2="724" y2="210"/>
      <line x1="934" y1="210" x2="954" y2="210"/>
    </g>

    <!-- return path -->
    <path d="M1060 302 L1060 334 Q1060 350 1044 350 L156 350 Q140 350 140 334 L140 306" fill="none" stroke="#F59E6B" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowOrange)"/>
    <rect x="390" y="336" width="420" height="28" rx="14" fill="#16213a"/>
    <text x="600" y="356" text-anchor="middle" fill="#fbc4a3" font-size="15" font-weight="600">Reviewable · revertible · documented — every time</text>
  </g>
</svg>
